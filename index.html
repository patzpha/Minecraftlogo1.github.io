<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisionS°MR</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}

#gif{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#site{
  display:none;
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<img id="gif" src="imagem/gif.gif">

<iframe id="site"></iframe>

<script>
setTimeout(()=>{
  document.getElementById("gif").remove();

  const site=document.getElementById("site");
  site.src="home.html";
  site.style.display="block";
},4500);
</script>

</body>
</html>
